<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Voyages — carnet de voyage en ligne : découvrez des destinations, préparez vos voyages et sauvegardez vos lieux favoris." />
    <title>Voyages — Carnet de voyage</title>
    <script type="text/javascript">
      // Restaure l'URL réelle après la redirection faite par public/404.html
      // (astuce SPA pour GitHub Pages : https://github.com/rafgraph/spa-github-pages)
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&")
            })
            .join("?")
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
