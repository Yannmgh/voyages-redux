<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voyages-redux</title>
    <script type="text/javascript">
      // GitHub Pages ne sait pas servir les routes internes d'une SPA (ex: /voyages-redux/destinations/japan) :
      // il renvoie cette page 404, qui redirige vers index.html en encodant le chemin d'origine
      // dans la query string. index.html restaure ensuite l'URL réelle avant que React Router ne démarre.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // nombre de segments à conserver : /voyages-redux

      var l = window.location
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
